plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '2.7.18'
}
apply plugin: "io.spring.dependency-management"

group = 'org.apache.fineract'
version = 'gazelle-1.1.0'
sourceCompatibility = '17'
targetCompatibility = '17'

bootJar {
    mainClass = 'org.apache.fineract.ServerApplication'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local') }
    maven { url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local') }
}

ext {
    springBootVersion = '2.7.18'
}

dependencies {
    // --- Spring Boot ---
    implementation "org.springframework.boot:spring-boot-starter:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-web:$springBootVersion"
    implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Security ---
    implementation 'org.springframework.security:spring-security-jwt:1.1.1.RELEASE'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.security.oauth:spring-security-oauth2:2.5.2.RELEASE'

    // --- JSON & Utils ---
    implementation 'org.json:json:20220924'
    implementation 'joda-time:joda-time:2.12.2'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'commons-io:commons-io:2.11.0'

    // --- DB & JPA ---
    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa:2.7.10'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'com.googlecode.flyway:flyway-core:2.1.1'
    implementation 'net.sf.ehcache:ehcache:2.10.9.2'

    // --- Metamodel generation (Hibernate, works without persistence.xml) ---
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:5.6.15.Final'

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    // --- Other libs ---
    implementation 'net.sf.supercsv:super-csv:2.4.0'
    implementation 'com.amazonaws:aws-java-sdk:1.12.400'
    implementation 'com.azure:azure-storage-blob:12.20.0'
    implementation 'org.mifos:ph-ee-connector-common:1.4.1-gazelle'
    implementation "org.springdoc:springdoc-openapi-ui:1.6.14"

    // --- Tests ---
    testImplementation 'junit:junit:4.13.2'
}

sourceSets {
    generated {
        java {
            srcDirs = ['src/generated/java']
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.annotationProcessorGeneratedSourcesDirectory = file("src/generated/java")
    options.release = 17
    options.compilerArgs.addAll(['-parameters'])
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}
